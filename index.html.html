<!-- Modal root -->
<div id="modalRoot"></div>

<script>
/* ============================================================================
   شاهين إكسبرس — نسخة ملف واحد (Single-File Edition)
   ----------------------------------------------------------------------------
   تنبيه أمني مهم:
   هذه النسخة تعمل بالكامل من المتصفح ولا تحتوي على أي خادم (backend).
   لذلك رمز UltraMsg (Token) محفوظ ويُستخدم مباشرة من كود الصفحة، وهو ما يعني:
     - أي شخص يفتح "أدوات المطوّر" في المتصفح يمكنه رؤية الـ Token.
     - هذا الملف غير مخصص للنشر العام على الإنترنت — استخدمه محليًا فقط
       على جهازك، أو خلف حماية بكلمة مرور إن استضفته.
     - النسخة الكاملة (Next.js + Supabase) التي بنيناها سابقًا تحل هذه المشكلة
       عبر إبقاء الـ Token في السيرفر فقط — ارجع إليها عند الجاهزية للإنتاج.

   قيود إضافية بسبب عدم وجود خادم:
     - لا يوجد Webhook حقيقي لاستقبال الردود فور وصولها. بدلاً من ذلك، زر
       "تحديث الردود" في صفحة الوارد يسحب آخر الرسائل من UltraMsg يدويًا.
     - إرسال الحملات يعمل فقط أثناء إبقاء هذه الصفحة مفتوحة في المتصفح —
       إغلاق التبويب يوقف الإرسال (على عكس النسخة الكاملة التي تعمل من السيرفر).
     - إن رفض متصفحك الاتصال بـ api.ultramsg.com بسبب CORS، فهذا يعني أن
       UltraMsg لا يسمح بطلبات مباشرة من المتصفح، وستحتاج عندها لخادم وسيط
       بسيط (proxy) — وهو بالضبط ما توفره النسخة الكاملة.
   ============================================================================ */

const ULTRAMSG_BASE = "https://api.ultramsg.com";
const STORAGE_KEY = "shaheen_crm_v1";

const STATUS_META = {
  NEW: {label:"جديد", cls:"bg-gray-100 text-gray-700"},
  CONTACTED: {label:"تم التواصل", cls:"bg-blue-100 text-blue-700"},
  WAITING_REPLY: {label:"بانتظار الرد", cls:"bg-amber-100 text-amber-800"},
  APPROVED: {label:"وافق", cls:"bg-green-100 text-green-800"},
  READY_TO_ADD: {label:"جاهز للإضافة", cls:"bg-emerald-100 text-emerald-800"},
  REJECTED: {label:"رفض", cls:"bg-red-100 text-red-700"},
  FOLLOW_UP: {label:"يحتاج متابعة", cls:"bg-purple-100 text-purple-700"},
  STOPPED: {label:"تم إيقاف التواصل", cls:"bg-slate-200 text-slate-700"},
  INVALID_NUMBER: {label:"رقم غير صالح", cls:"bg-red-50 text-red-500"},
};

/* ---------------------------------------------------------------------- */
/* State: everything lives in localStorage under STORAGE_KEY               */
/* ---------------------------------------------------------------------- */
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {
    settings:{
      instanceId:"", token:"",
      initialTemplate:"مرحباً {{contact_name}}، معكم فريق شاهين إكسبرس 🦅\n\nنود الحصول على موافقتكم لإضافة وعرض مطعمكم ضمن تطبيق شاهين إكسبرس لخدمات التوصيل.\n\nإذا كنتم موافقين، يرجى الرد بكلمة «موافق».\nوإذا لم ترغبوا، يرجى الرد «غير موافق».\n\nشكراً لكم 🌹",
      followupTemplate:"مرحباً، نتابع معكم رسالتنا السابقة بخصوص إمكانية إضافة مطعمكم إلى تطبيق شاهين إكسبرس.\n\nإذا كنتم موافقين يرجى الرد بكلمة «موافق»، وإذا لم ترغبوا يرجى الرد «غير موافق».\n\nشكرًا لكم 🌹",
      followupHours:24, followupMax:3, sendDelayMs:4000
    },
    restaurants:[],   // {id,name,phone,area,contactName,notes,status,doNotContact,followUpCount,createdAt,lastOutboundAt,lastInboundAt}
    campaigns:[],     // {id,name,template,status,recipients:[{restaurantId,status,message,error}],createdAt}
    messages:[]       // {id,restaurantId,direction,body,createdAt,campaignId}
  };
}
let state = loadState();
function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function nowIso(){ return new Date().toISOString(); }
function esc(s){ return (s??"").toString().replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* ---------------------------------------------------------------------- */
/* Phone helpers                                                          */
/* ---------------------------------------------------------------------- */
function normalizePhone(raw){
  const cleaned = (raw||"").trim().replace(/[^\d+]/g,"");
  const digits = cleaned.replace(/\+/g,"");
  if(digits.length < 8 || digits.length > 15) return {valid:false, reason:"رقم الهاتف غير صالح (عدد الأرقام غير منطقي)."};
  if(!/^\d+$/.test(digits)) return {valid:false, reason:"رقم يحتوي رموز غير مسموحة."};
  return {valid:true, e164: cleaned.startsWith("+")?cleaned:("+"+digits)};
}

/* ---------------------------------------------------------------------- */
/* Template rendering                                                     */
/* ---------------------------------------------------------------------- */
function renderTemplate(tpl, r){
  let out = tpl;
  if(r.contactName && r.contactName.trim()){
    out = out.replaceAll("{{contact_name}}", r.contactName.trim());
  }else{
    out = out.replace(/\s*{{contact_name}}\s*،/g,"،").replace(/{{contact_name}}\s*/g,"");
  }
  out = out.replaceAll("{{restaurant_name}}", r.name||"");
  out = out.replaceAll("{{area}}", r.area||"");
  return out.replace(/[ \t]{2,}/g," ").trim();
}

/* ---------------------------------------------------------------------- */
/* Reply classification                                                   */
/* ---------------------------------------------------------------------- */
const REJECTED_PATTERNS=["غير موافق","مو موافق","لا أوافق","لا اوافق","لا نوافق","رفض","ما بدي","لا أريد","لا اريد","لا تراسلوني","الغاء","إلغاء"];
const APPROVED_PATTERNS=["موافق","موافقين","نعم","تمام موافق","أوافق","اوافق","اكيد","أكيد","تمام"];
function normalizeAr(t){
  return (t||"").trim().toLowerCase()
    .replace(/[\u064B-\u0652]/g,"").replace(/[إأآا]/g,"ا").replace(/ة/g,"ه").replace(/[ىي]/g,"ي");
}
function classifyReply(body){
  const t = normalizeAr(body);
  for(const p of REJECTED_PATTERNS) if(t.includes(normalizeAr(p))) return "REJECTED";
  for(const p of APPROVED_PATTERNS) if(t.includes(normalizeAr(p))) return "APPROVED";
  return "FOLLOW_UP";
}

/* ---------------------------------------------------------------------- */
/* UltraMsg calls (direct from browser — see security note above)         */
/* ---------------------------------------------------------------------- */
async function ultramsgSend(to, body){
  const {instanceId, token} = state.settings;
  if(!instanceId || !token) return {ok:false, error:"لم يتم ضبط Instance ID / Token في الإعدادات."};
  const chatId = to.startsWith("+") ? to.slice(1) : to;
  try{
    const res = await fetch(`${ULTRAMSG_BASE}/${instanceId}/messages/chat`, {
      method:"POST",
      headers:{"Content-Type":"application/x-www-form-urlencoded"},
      body: new URLSearchParams({token, to:chatId, body}).toString()
    });
    const json = await res.json().catch(()=>null);
    const ok = res.ok && json && (json.sent==="true"||json.sent===true);
    return ok ? {ok:true, id:json.id} : {ok:false, error: json?.message || `HTTP ${res.status}`};
  }catch(e){
    return {ok:false, error: "تعذر الاتصال (قد يكون بسبب CORS أو الشبكة): "+e.message};
  }
}

async function ultramsgTestConnection(){
  const {instanceId, token} = state.settings;
  if(!instanceId || !token) return {ok:false, message:"لم يتم ضبط الإعدادات."};
  try{
    const res = await fetch(`${ULTRAMSG_BASE}/${instanceId}/instance/status?token=${encodeURIComponent(token)}`);
    const json = await res.json().catch(()=>null);
    if(!res.ok) return {ok:false, message: json?.message || `HTTP ${res.status}`};
    const status = json?.status;
    return status==="authenticated"
      ? {ok:true, message:"تم الاتصال بنجاح بـ UltraMsg"}
      : {ok:false, message:`الحالة الحالية: ${status||"غير معروفة"}. تأكد من مسح رمز QR في لوحة UltraMsg.`};
  }catch(e){
    return {ok:false, message:"تعذر الاتصال بـ WhatsApp. تحقق من الإعدادات أو من قيود CORS: "+e.message};
  }
}

// Pulls recent chat messages from UltraMsg and classifies any new incoming
// ones against our restaurants list. This substitutes for a real webhook,
// which this single-file, no-backend version cannot receive.
async function ultramsgFetchReplies(){
  const {instanceId, token} = state.settings;
  if(!instanceId || !token) return {ok:false, message:"لم يتم ضبط الإعدادات."};
  try{
    const res = await fetch(`${ULTRAMSG_BASE}/${instanceId}/chats/messages?token=${encodeURIComponent(token)}&limit=100`);
    const json = await res.json().catch(()=>null);
    if(!res.ok) return {ok:false, message: json?.message || `HTTP ${res.status}`};
    const items = Array.isArray(json) ? json : (json?.messages || []);
    let updated = 0;
    for(const m of items){
      if(m.fromMe) continue;
      const rawFrom = (m.from||"").replace(/@c\.us$/i,"").replace(/^\+/,"");
      const check = normalizePhone(rawFrom);
      const phone = check.valid ? check.e164 : "+"+rawFrom;
      const r = state.restaurants.find(x=>x.phone===phone);
      if(!r) continue;
      const already = state.messages.some(x=>x.restaurantId===r.id && x.direction==="INBOUND" && x.body===m.body && x.ultramsgId===m.id);
      if(already) continue;
      state.messages.push({id:uid(), restaurantId:r.id, direction:"INBOUND", body:m.body||"", createdAt:new Date((m.time||Date.now()/1000)*1000).toISOString(), ultramsgId:m.id});
      r.lastInboundAt = nowIso();
      r.nextFollowUpAt = null;
      if(!r.doNotContact && r.status!=="STOPPED"){
        const cls = classifyReply(m.body||"");
        r.status = cls;
      }
      updated++;
    }
    save();
    return {ok:true, message:`تم جلب الرسائل. عدد الردود الجديدة المعالجة: ${updated}`};
  }catch(e){
    return {ok:false, message:"تعذر جلب الردود (قد يكون بسبب CORS): "+e.message};
  }
}

/* ---------------------------------------------------------------------- */
/* Navigation / views                                                     */
/* ---------------------------------------------------------------------- */
const NAV = [
  {id:"dashboard", label:"لوحة التحكم", icon:"📊"},
  {id:"restaurants", label:"المطاعم", icon:"🍽️"},
  {id:"campaigns", label:"الحملات", icon:"📢"},
  {id:"inbox", label:"الوارد", icon:"💬"},
  {id:"approved", label:"الموافقات", icon:"✅"},
  {id:"followup", label:"بحاجة متابعة", icon:"🔁"},
  {id:"dnc", label:"إيقاف التواصل", icon:"🚫"},
  {id:"settings", label:"الإعدادات", icon:"⚙️"},
];
let currentView = "dashboard";

function renderNav(){
  const html = NAV.map(n=>`<div class="nav-item ${n.id===currentView?'active':''}" onclick="goTo('${n.id}')"><span>${n.icon}</span>${n.label}</div>`).join("");
  document.getElementById("nav").innerHTML = html;
  document.getElementById("mobileNav").innerHTML = html;
}
function goTo(view){
  currentView = view;
  document.getElementById("mobileNav").classList.add("hidden");
  renderNav();
  renderView();
}

function renderView(){
  const el = document.getElementById("views");
  if(currentView==="dashboard") el.innerHTML = viewDashboard();
  else if(currentView==="restaurants") el.innerHTML = viewRestaurants();
  else if(currentView==="campaigns") el.innerHTML = viewCampaigns();
  else if(currentView==="inbox") el.innerHTML = viewInbox();
  else if(currentView==="approved") el.innerHTML = viewFiltered(["APPROVED","READY_TO_ADD"], "لا توجد مطاعم موافقة بعد.", "🟢 تمت الموافقة");
  else if(currentView==="followup") el.innerHTML = viewFiltered(["FOLLOW_UP"], "لا توجد مطاعم بحاجة متابعة.", "بحاجة متابعة");
  else if(currentView==="dnc") el.innerHTML = viewDnc();
  else if(currentView==="settings") el.innerHTML = viewSettings();
  attachHandlers();
}

/* ---------------------------------------------------------------------- */
/* Dashboard                                                              */
/* ---------------------------------------------------------------------- */
function viewDashboard(){
  const rs = state.restaurants;
  const count = f => rs.filter(f).length;
  const stats = {
    total: rs.length,
    nw: count(r=>r.status==="NEW"),
    contacted: count(r=>r.status!=="NEW"),
    waiting: count(r=>r.status==="WAITING_REPLY"),
    approved: count(r=>r.status==="APPROVED"||r.status==="READY_TO_ADD"),
    rejected: count(r=>r.status==="REJECTED"),
    followup: count(r=>r.status==="FOLLOW_UP"),
    stopped: count(r=>r.status==="STOPPED"||r.doNotContact),
  };
  const max = Math.max(1, stats.contacted, stats.approved, stats.rejected, stats.followup);
  const bar = (label,val,color)=>`
    <div class="flex items-center gap-3">
      <div class="w-28 shrink-0 text-xs text-gray-500">${label}</div>
      <div class="h-3 flex-1 rounded-full bg-gray-100"><div class="h-3 rounded-full ${color}" style="width:${Math.min(100,(val/max)*100)}%"></div></div>
      <div class="w-10 text-left text-xs font-medium">${val}</div>
    </div>`;
  const card = (label,val,color)=>`<div class="card p-4"><div class="mb-2 h-1 w-8 rounded-full ${color}"></div><div class="text-2xl font-bold">${val}</div><div class="text-xs text-gray-500">${label}</div></div>`;
  return `
    <h1 class="text-xl font-bold mb-1">لوحة التحكم</h1>
    <p class="text-sm text-gray-500 mb-5">نظرة عامة على حالة استقطاب المطاعم</p>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
      ${card("إجمالي المطاعم", stats.total, "bg-green-800")}
      ${card("جديد", stats.nw, "bg-gray-500")}
      ${card("تم التواصل", stats.contacted, "bg-blue-600")}
      ${card("بانتظار الرد", stats.waiting, "bg-amber-500")}
      ${card("وافقوا", stats.approved, "bg-green-600")}
      ${card("رفضوا", stats.rejected, "bg-red-600")}
      ${card("يحتاجون متابعة", stats.followup, "bg-purple-600")}
      ${card("موقوف عنهم التواصل", stats.stopped, "bg-slate-500")}
    </div>
    <div class="card p-5">
      <h2 class="text-sm font-semibold mb-4">نتائج التواصل</h2>
      <div class="space-y-3">
        ${bar("تم التواصل", stats.contacted, "bg-blue-600")}
        ${bar("وافقوا", stats.approved, "bg-green-600")}
        ${bar("رفضوا", stats.rejected, "bg-red-600")}
        ${bar("بانتظار الرد", stats.waiting, "bg-amber-500")}
        ${bar("يحتاجون متابعة", stats.followup, "bg-purple-600")}
      </div>
    </div>`;
}

/* ---------------------------------------------------------------------- */
/* Restaurants                                                            */
/* ---------------------------------------------------------------------- */
let restaurantFilters = {q:"", status:""};
function viewRestaurants(){
  const rows = state.restaurants.filter(r=>{
    if(restaurantFilters.status && r.status!==restaurantFilters.status) return false;
    if(restaurantFilters.q){
      const q = restaurantFilters.q.toLowerCase();
      if(!(r.name.toLowerCase().includes(q) || r.phone.includes(q) || (r.area||"").toLowerCase().includes(q))) return false;
    }
    return true;
  });
  const statusOptions = Object.keys(STATUS_META).map(s=>`<option value="${s}" ${restaurantFilters.status===s?'selected':''}>${STATUS_META[s].label}</option>`).join("");
  return `
    <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
      <div><h1 class="text-xl font-bold">المطاعم</h1><p class="text-sm text-gray-500">${state.restaurants.length} مطعم</p></div>
      <div class="flex gap-2">
        <button class="btn btn-secondary" onclick="openImportModal()">استيراد CSV</button>
        <button class="btn btn-primary" onclick="openAddRestaurantModal()">+ إضافة مطعم</button>
      </div>
    </div>
    <div class="flex flex-wrap gap-3 mb-4">
      <input class="input max-w-xs" placeholder="بحث بالاسم أو الرقم أو المنطقة..." value="${esc(restaurantFilters.q)}" oninput="restaurantFilters.q=this.value; renderView()">
      <select class="input max-w-[200px]" onchange="restaurantFilters.status=this.value; renderView()">
        <option value="">كل الحالات</option>${statusOptions}
      </select>
    </div>
    <div class="card overflow-x-auto">
      <table class="w-full min-w-[700px] text-sm">
        <thead class="bg-gray-50 text-xs text-gray-500"><tr>
          <th class="px-4 py-3 text-right font-medium">المطعم</th>
          <th class="px-4 py-3 text-right font-medium">الرقم</th>
          <th class="px-4 py-3 text-right font-medium">المنطقة</th>
          <th class="px-4 py-3 text-right font-medium">الحالة</th>
          <th class="px-4 py-3 text-right font-medium">إجراءات</th>
        </tr></thead>
        <tbody class="divide-y">
          ${rows.map(r=>`
            <tr class="hover:bg-gray-50">
              <td class="px-4 py-3 font-medium">${esc(r.name)}</td>
              <td class="px-4 py-3 text-gray-500" dir="ltr">${esc(r.phone)}</td>
              <td class="px-4 py-3 text-gray-500">${esc(r.area||"—")}</td>
              <td class="px-4 py-3"><span class="badge ${STATUS_META[r.status].cls}">${STATUS_META[r.status].label}</span></td>
              <td class="px-4 py-3">
                <button class="text-xs text-red-600 hover:underline" onclick="deleteRestaurant('${r.id}')">حذف</button>
              </td>
            </tr>`).join("")}
          ${rows.length===0?`<tr><td colspan="5" class="px-4 py-10 text-center text-gray-500">لا توجد نتائج مطابقة.</td></tr>`:""}
        </tbody>
      </table>
    </div>`;
}

function deleteRestaurant(id){
  if(!confirm("حذف هذا المطعم نهائيًا؟")) return;
  state.restaurants = state.restaurants.filter(r=>r.id!==id);
  save(); renderView();
}

function openAddRestaurantModal(){
  showModal(`إضافة مطعم`, `
    <form id="addRestaurantForm" class="space-y-3">

function openImportModal(){

    <input type="file" id="csvFile" accept=".csv" class="text-sm mb-3">
    <div id="csvPreview"></div>`);
  document.getElementById("csvFile").onchange = (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=> analyzeCsv(reader.result);
    reader.readAsText(file, "utf-8");
  };
}

function parseCsv(text){
  const lines = text.replace(/\r\n/g,"\n").split("\n").filter(l=>l.trim());
  if(lines.length===0) return [];
  const split = (line)=>{
    const out=[]; let cur=""; let q=false;
    for(let i=0;i<line.length;i++){
      const c=line[i];
      if(q){ if(c==='"'&&line[i+1]==='"'){cur+='"';i++;} else if(c==='"'){q=false;} else cur+=c; }
      else { if(c==='"') q=true; else if(c===','){out.push(cur);cur="";} else cur+=c; }
    }
    out.push(cur); return out;
  };
  const headers = split(lines[0]).map(h=>h.trim().toLowerCase());
  return lines.slice(1).map(line=>{
    const cells = split(line); const row={};
    headers.forEach((h,i)=> row[h]=(cells[i]||"").trim());
    return row;
  });
}

let pendingImportRows = [];
function analyzeCsv(text){
  const rows = parseCsv(text);
  const existingPhones = new Set(state.restaurants.map(r=>r.phone));
  const seen = new Set();
  const analyzed = rows.map(r=>{
    const name = r.name?.trim(); const phoneRaw = r.phone?.trim();
    if(!name || !phoneRaw) return {outcome:"missing"};
    const check = normalizePhone(phoneRaw);
    if(!check.valid) return {outcome:"invalid"};
    if(seen.has(check.e164)) return {outcome:"dupFile"};
    if(existingPhones.has(check.e164)) return {outcome:"dupDb"};
    seen.add(check.e164);
    return {outcome:"valid", name, phone:check.e164, area:r.area||"", contactName:r.contact_name||"", notes:r.notes||""};
  });
  pendingImportRows = analyzed.filter(a=>a.outcome==="valid");
  const summary = {
    total: analyzed.length, valid: pendingImportRows.length,
    dup: analyzed.filter(a=>a.outcome==="dupFile"||a.outcome==="dupDb").length,
    invalid: analyzed.filter(a=>a.outcome==="invalid"||a.outcome==="missing").length,
  };
  document.getElementById("csvPreview").innerHTML = `
    <div class="rounded-lg bg-gray-50 p-3 text-sm mb-3">
      <p>تم العثور على ${summary.total} صف.</p>
      <p class="text-green-700">✔ ${summary.valid} صالح</p>
      <p class="text-amber-700">⚠ ${summary.dup} مكرر</p>
      <p class="text-red-700">✘ ${summary.invalid} غير صالح</p>
    </div>
    <button class="btn btn-primary w-full" onclick="confirmImport()" ${summary.valid===0?'disabled':''}>تأكيد استيراد ${summary.valid} مطعم</button>`;
}
function confirmImport(){
  pendingImportRows.forEach(r=>{
    state.restaurants.push({
      id:uid(), name:r.name, phone:r.phone, area:r.area, contactName:r.contactName, notes:r.notes,
      status:"NEW", doNotContact:false, followUpCount:0, createdAt:nowIso(), lastOutboundAt:null, lastInboundAt:null, nextFollowUpAt:null
    });
  });
  save(); closeModal(); goTo("restaurants");
}

    if(targetType==="not_contacted") return r.status==="NEW";

  });

function confirmStartCampaign(id){
  const c = state.campaigns.find(x=>x.id===id);
  const remaining = c.recipients.filter(r=>r.status==="PENDING"||r.status==="FAILED").length;
  showModal("تأكيد الإرسال", `
    <p class="mb-4">سيتم إرسال الرسائل إلى ${remaining} جهة اتصال.</p>
    <div class="flex gap-2">
      <button class="btn btn-secondary flex-1" onclick="closeModal()">إلغاء</button>
      <button class="btn btn-primary flex-1" onclick="closeModal(); startCampaign('${id}')">بدء الإرسال</button>
    </div>`);
}

async function startCampaign(id){
  const c = state.campaigns.find(x=>x.id===id);
  c.status = "RUNNING";
  runningCampaignFlags[id] = {paused:false};
  save();
  if(currentView.startsWith("campaign_detail_")) renderCampaignDetail(id);
  else renderView();

  for(const rec of c.recipients){
    if(runningCampaignFlags[id]?.paused) break;
    if(rec.status!=="PENDING" && rec.status!=="FAILED") continue;
    const r = state.restaurants.find(x=>x.id===rec.restaurantId);
    if(!r || r.doNotContact || r.status==="STOPPED"){ rec.status="SKIPPED"; continue; }

    rec.status = "QUEUED"; save();
    const result = await ultramsgSend(r.phone, rec.message);
    if(result.ok){
      rec.status = "SENT";
      r.status = "WAITING_REPLY";
      r.lastOutboundAt = nowIso();
      r.nextFollowUpAt = new Date(Date.now() + state.settings.followupHours*3600*1000).toISOString();
      state.messages.push({id:uid(), restaurantId:r.id, direction:"OUTBOUND", body:rec.message, createdAt:nowIso(), campaignId:c.id});
    }else{
      rec.status = "FAILED";
      rec.error = result.error;
    }
    save();
    if(currentView.startsWith("campaign_detail_")) renderCampaignDetail(id);
    await new Promise(res=>setTimeout(res, state.settings.sendDelayMs));
  }

  const stillPaused = runningCampaignFlags[id]?.paused;
  if(!stillPaused){
    c.status = "COMPLETED";
    save();
  }
  if(currentView.startsWith("campaign_detail_")) renderCampaignDetail(id);
  else renderView();
}

function stopCampaign(id){
  if(runningCampaignFlags[id]) runningCampaignFlags[id].paused = true;
  const c = state.campaigns.find(x=>x.id===id);
  c.status = "PAUSED";
  save();
  renderCampaignDetail(id);
}

function exportCampaignCsv(id){
  const c = state.campaigns.find(x=>x.id===id);
  const rows = c.recipients.map(rec=>{
    const r = state.restaurants.find(x=>x.id===rec.restaurantId);
    return [r?.name||"", r?.phone||"", r?.area||"", r?.status||"", rec.status, rec.error||""];
  });
  const csv = ["restaurant_name,phone,area,restaurant_status,send_status,error", ...rows.map(r=>r.map(v=>`"${(v+"").replace(/"/g,'""')}"`).join(","))].join("\n");
  const blob = new Blob([csv], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `campaign-${c.name}.csv`;
  a.click();
}

function renderThread(restaurantId){
  const r = state.restaurants.find(x=>x.id===restaurantId);
  const msgs = state.messages.filter(m=>m.restaurantId===restaurantId).sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt));
  const blocked = r.doNotContact || r.status==="STOPPED";
  return `
    <div class="flex items-center gap-2 border-b p-4">
      <button class="md:hidden text-gray-500" onclick="selectedConversation=null; renderView()">→</button>
      <div class="flex-1"><div class="font-bold">${esc(r.name)}</div><div class="text-xs text-gray-500" dir="ltr">${esc(r.phone)}</div></div>

    </div>

        <div class="flex ${m.direction==='OUTBOUND'?'justify-start':'justify-end'}">

      <div class="flex gap-2">
        <input class="input" id="manualMsgInput" placeholder="اكتب رسالة..." onkeydown="if(event.key==='Enter') sendManualMessage('${r.id}')">
        <button class="btn btn-primary" onclick="sendManualMessage('${r.id}')">إرسال</button>
      </div>`}
    </div>`;
}

async function sendManualMessage(restaurantId){
  const input = document.getElementById("manualMsgInput");
  const body = input.value.trim();
  if(!body) return;
  input.disabled = true;
  const r = state.restaurants.find(x=>x.id===restaurantId);
  const result = await ultramsgSend(r.phone, body);
  if(result.ok){
    state.messages.push({id:uid(), restaurantId, direction:"OUTBOUND", body, createdAt:nowIso()});
    r.lastOutboundAt = nowIso();
    save();
  }else{
    alert("فشل الإرسال: "+result.error);
  }
  renderView();
}

async function refreshReplies(){
  const btn = event.target; btn.disabled = true; btn.textContent = "جارٍ التحديث...";
  const result = await ultramsgFetchReplies();
  btn.disabled = false; btn.textContent = "🔄 تحديث الردود";
  alert(result.message);
  renderView();
}

function openOnboardModal(id){
  const r = state.restaurants.find(x=>x.id===id);
  showModal(`إضافة ${esc(r.name)} إلى التطبيق`, `
    <form id="onboardForm" class="space-y-3">
      <div><label class="block text-sm font-medium mb-1">الوصف</label><textarea class="input" name="description" rows="3"></textarea></div>
      <div><label class="block text-sm font-medium mb-1">العنوان</label><input class="input" name="address"></div>
      <div class="grid grid-cols-2 gap-3">
        <div><label class="block text-sm font-medium mb-1">Lat</label><input class="input" name="lat" dir="ltr"></div>
        <div><label class="block text-sm font-medium mb-1">Lng</label><input class="input" name="lng" dir="ltr"></div>
      </div>
      <div><label class="block text-sm font-medium mb-1">أوقات العمل</label><input class="input" name="hours"></div>
      <div><label class="block text-sm font-medium mb-1">رابط صورة المطعم</label><input class="input" name="image" dir="ltr"></div>
      <div><label class="block text-sm font-medium mb-1">التصنيف</label><input class="input" name="category"></div>
      <button type="submit" class="btn btn-primary w-full">حفظ وتعليم كجاهز للإضافة</button>
    </form>`);
  document.getElementById("onboardForm").onsubmit = (e)=>{
    e.preventDefault();
    const f = new FormData(e.target);
    Object.assign(r, {
      onboardingDescription:f.get("description"), onboardingAddress:f.get("address"),
      onboardingLat:f.get("lat"), onboardingLng:f.get("lng"), onboardingHours:f.get("hours"),
      onboardingImage:f.get("image"), onboardingCategory:f.get("category"), status:"READY_TO_ADD"
    });
    save(); closeModal(); renderView();
  };
}

/* ---------------------------------------------------------------------- */
/* Do Not Contact                                                         */
/* ---------------------------------------------------------------------- */
function viewDnc(){
  const rows = state.restaurants.filter(r=>r.doNotContact || r.status==="STOPPED");
  return `
    <h1 class="text-xl font-bold mb-1">🚫 إيقاف التواصل</h1>
    <p class="text-sm text-gray-500 mb-4">مطاعم لن تُدرج في أي حملة مستقبلية</p>
    <div class="grid gap-3">
      ${rows.map(r=>`
        <div class="card p-4 flex flex-wrap items-center justify-between gap-3">
          <div><div class="font-semibold">${esc(r.name)}</div><div class="text-xs text-gray-500" dir="ltr">${esc(r.phone)}</div></div>
          <div class="flex items-center gap-3">
            <span class="badge ${STATUS_META[r.status].cls}">${STATUS_META[r.status].label}</span>
            <button class="btn btn-secondary" onclick="restoreRestaurant('${r.id}')">إعادة السماح بالتواصل</button>
          </div>
        </div>`).join("")}
      ${rows.length===0?`<p class="text-sm text-gray-500">لا توجد مطاعم موقوف عنها التواصل.</p>`:""}
    </div>`;
}
function restoreRestaurant(id){
  if(!confirm("سيتم السماح بالتواصل مع هذا المطعم مجددًا. متابعة؟")) return;
  const r = state.restaurants.find(x=>x.id===id);
  r.doNotContact = false; r.status = "NEW";
  save(); renderView();
}

// Called from the restaurants table / thread — sets STOPPED + doNotContact.
function stopContact(id){
  const r = state.restaurants.find(x=>x.id===id);
  if(!r) return;
  if(!confirm(`إيقاف التواصل مع ${r.name}؟`)) return;
  r.status = "STOPPED"; r.doNotContact = true; r.nextFollowUpAt = null;
  save(); renderView();
}

/* ---------------------------------------------------------------------- */
/* Settings                                                               */
/* ---------------------------------------------------------------------- */
function viewSettings(){
  const s = state.settings;
  return `
    <h1 class="text-xl font-bold mb-4">الإعدادات</h1>
    <div class="max-w-2xl space-y-6">
      <section class="card p-5 space-y-3">
        <h2 class="font-semibold">WhatsApp — UltraMsg</h2>
        <p class="text-xs text-red-600">⚠ هذه القيم تُستخدم مباشرة من المتصفح ومرئية في كود الصفحة. لا تشارك هذا الملف مع أي شخص بعد إدخال بياناتك.</p>
        <div><label class="block text-sm font-medium mb-1">Instance ID</label><input class="input" id="s_instanceId" dir="ltr" value="${esc(s.instanceId)}"></div>
        <div><label class="block text-sm font-medium mb-1">Token</label><input class="input" id="s_token" dir="ltr" type="password" value="${esc(s.token)}"></div>
        <div class="flex gap-2">
          <button class="btn btn-primary" onclick="saveUltramsgSettings()">حفظ</button>
          <button class="btn btn-secondary" onclick="testConnectionUi()">اختبار الاتصال</button>
        </div>
        <p id="connTestResult" class="text-sm"></p>
      </section>

      <section class="card p-5 space-y-3">
        <h2 class="font-semibold">رسالة التواصل الأولى</h2>
        <textarea class="input" id="s_initialTemplate" rows="6">${esc(s.initialTemplate)}</textarea>
        <button class="btn btn-primary" onclick="saveField('initialTemplate','s_initialTemplate')">حفظ</button>
      </section>

      <section class="card p-5 space-y-3">
        <h2 class="font-semibold">إعدادات الإرسال</h2>
        <div class="grid grid-cols-2 gap-3">
          <div><label class="block text-sm font-medium mb-1">التأخير بين الرسائل (مللي ثانية)</label><input type="number" class="input" id="s_delay" value="${s.sendDelayMs}"></div>
          <div><label class="block text-sm font-medium mb-1">الفاصل الزمني للمتابعة (ساعات)</label><input type="number" class="input" id="s_fuHours" value="${s.followupHours}"></div>
        </div>
        <button class="btn btn-primary" onclick="saveNumericSettings()">حفظ</button>
      </section>

      <section class="card p-5 space-y-3">
        <h2 class="font-semibold">تصدير / استيراد نسخة احتياطية</h2>
        <p class="text-xs text-gray-500">كل بياناتك محفوظة في متصفحك فقط. صدّرها بشكل دوري لتجنب فقدانها.</p>
        <div class="flex gap-2">
          <button class="btn btn-secondary" onclick="exportBackup()">تصدير نسخة احتياطية (JSON)</button>
          <label class="btn btn-secondary cursor-pointer">استيراد نسخة احتياطية<input type="file" accept=".json" class="hidden" onchange="importBackup(event)"></label>
        </div>
      </section>
    </div>`;
}
function saveUltramsgSettings(){
  state.settings.instanceId = document.getElementById("s_instanceId").value.trim();
  state.settings.token = document.getElementById("s_token").value.trim();
  save();
  alert("تم الحفظ.");
}
function saveField(key, elId){
  state.settings[key] = document.getElementById(elId).value;
  save(); alert("تم الحفظ.");
}
function saveNumericSettings(){
  state.settings.sendDelayMs = Number(document.getElementById("s_delay").value)||4000;
  state.settings.followupHours = Number(document.getElementById("s_fuHours").value)||24;
  save(); alert("تم الحفظ.");
}
async function testConnectionUi(){
  const el = document.getElementById("connTestResult");
  el.textContent = "جارٍ الاختبار...";
  const r = await ultramsgTestConnection();
  el.textContent = r.message;
  el.className = "text-sm " + (r.ok ? "text-green-700" : "text-red-600");
}
function exportBackup(){
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `shaheen-crm-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
}
function importBackup(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const data = JSON.parse(reader.result);
      if(!confirm("سيتم استبدال كل البيانات الحالية بالنسخة المستوردة. متابعة؟")) return;
      state = data; save(); goTo("dashboard");
    }catch(err){ alert("ملف غير صالح."); }
  };
  reader.readAsText(file);
}

/* ---------------------------------------------------------------------- */
/* Modal helper                                                           */
/* ---------------------------------------------------------------------- */
function showModal(title, bodyHtml){
  document.getElementById("modalRoot").innerHTML = `
    <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4" onclick="if(event.target===this) closeModal()">
      <div class="card w-full max-w-lg max-h-[90vh] overflow-y-auto p-5" onclick="event.stopPropagation()">
        <div class="flex items-center justify-between mb-4">
          <h3 class="font-bold">${title}</h3>
          <button onclick="closeModal()" class="text-gray-500 hover:text-black">✕</button>
        </div>
        ${bodyHtml}
      </div>
    </div>`;
}
function closeModal(){ document.getElementById("modalRoot").innerHTML = ""; }

function attachHandlers(){ /* reserved for future use */ }

/* ---------------------------------------------------------------------- */
/* Boot                                                                    */
/* ---------------------------------------------------------------------- */
renderNav();
renderView();
</script>
</body>
</html>
